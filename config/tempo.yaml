server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_size_bytes: 52428800
    compacted_block_size_bytes: 524288000

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    retention:
      retention_period: 24h
      max_bytes: 536870912 # 512MB limit for traces
