server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks

# --- FIXED COMPACTOR AND RETENTION SCHEMA ---
compactor:
  compaction:
    compaction_window: 1h
    block_retention: 24h             # Correct: Tells Tempo to purge traces older than 24h
    compacted_block_retention: 1h    # Correct: Cleans internal runtime cache items to stay well under 512MB
