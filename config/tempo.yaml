server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks

# --- COMPACTOR & RETENTION RULESETS FOR TEMPO ---
compactor:
  compaction:
    compaction_window: 1h
  retention:
    block_retention: 24h # Purge trace files older than 24 hours
